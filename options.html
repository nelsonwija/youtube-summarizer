<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        max-width: 560px;
        margin: 30px auto;
        padding: 0 16px;
        font: 14px/1.5 system-ui, sans-serif;
        color: #111;
      }
      h1 { font-size: 18px; }
      label { display: block; margin: 18px 0 6px; font-weight: 600; }
      select, textarea {
        width: 100%;
        padding: 8px;
        font: inherit;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
      }
      textarea { min-height: 140px; resize: vertical; }
      .hint { color: #777; font-size: 12px; margin-top: 4px; }
      button {
        margin-top: 18px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #c15f3c;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      #saved { margin-left: 10px; color: #2e7d32; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>YouTube Summarizer — Options</h1>

    <div class="hint">Summaries run in a ChatGPT <b>temporary chat</b> — make sure you're logged in to chatgpt.com.</div>

    <label for="template">Prompt template</label>
    <textarea id="template"></textarea>
    <div class="hint">Placeholders: <code>{title}</code>, <code>{transcript}</code></div>

    <button id="save">Save</button>
    <span id="saved"></span>

    <script src="options.js"></script>
  </body>
</html>
